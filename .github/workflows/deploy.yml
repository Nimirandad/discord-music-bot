name: CI and deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: discord-music-bot-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Calculate image version
        id: version
        shell: bash
        run: echo "tag=1.1.$((GITHUB_RUN_NUMBER + 4))" >> "$GITHUB_OUTPUT"

      - name: Connect runner to the private tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load restricted Oracle deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_DEPLOY_SSH_KEY }}

      - name: Configure pinned SSH host key
        env:
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check private SSH access and deploy permission
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20
          "$ORACLE_HOST"
          'sudo -n -l /usr/local/sbin/deploy-discord-music-bot'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/nimirandad/discord-music-bot:${{ steps.version.outputs.tag }}
            ghcr.io/nimirandad/discord-music-bot:sha-${{ github.sha }}

      - name: Deploy and verify health
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          IMAGE: ghcr.io/nimirandad/discord-music-bot:${{ steps.version.outputs.tag }}
        run: >-
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20
          "$ORACLE_HOST"
          "sudo /usr/local/sbin/deploy-discord-music-bot '$IMAGE'"
